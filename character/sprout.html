<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout Test</title>
<style>
:root { --bg: #f3f3ef; --panel: #fff; --text: #1b1c20; --muted: #6a6c75; --line: #e1e1da; --chip: #efefea; --accent: #3d6bff; --accent-text: #fff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111216; --panel: #1a1b20; --text: #ececef; --muted: #9a9ca6; --line: #2b2d34; --chip: #24252b; --accent: #7d9bff; --accent-text: #0e1020; }
}
:root[data-theme="dark"] { --bg: #111216; --panel: #1a1b20; --text: #ececef; --muted: #9a9ca6; --line: #2b2d34; --chip: #24252b; --accent: #7d9bff; --accent-text: #0e1020; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 14px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--chip); color: var(--text); }
button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.big { background: #17181d; border-radius: 12px; padding: 8px 0; display: grid; place-items: center; margin-bottom: 10px; }
.smalls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border-radius: 8px; padding: 6px 14px; display: grid; place-items: center; }
.dark { background: #1d1e23; } .light { background: #ecebe6; }
.wall { background: linear-gradient(135deg, #4b5d86, #9b6f8f 55%, #d59a6e); }
.bright { background: linear-gradient(135deg, #e6eefa, #f6f1e7 55%, #f7dcc8); }
canvas { display: block; cursor: pointer; }
textarea { width: 100%; height: 90px; font: 11px ui-monospace, monospace; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--text); padding: 8px; }
.status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Sprout test</h1>
  <p>The packaged <code>sprout.js</code> on its own, the way the Blip app will use it. Keys 1 to 5 switch states; click Sprout to poke it. Quick clicks: 3 for a bubble, 6 or more and it gets fed up.</p>
  <div class="row" id="states"></div>
  <div class="big"><canvas id="big"></canvas></div>
  <div class="smalls">
    <div class="chip dark"><canvas></canvas></div><div class="chip light"><canvas></canvas></div>
    <div class="chip wall"><canvas></canvas></div><div class="chip bright"><canvas></canvas></div>
  </div>
  <p class="status" id="status"></p>
  <p>Paste settings from the playground's "Copy settings" to apply them:</p>
  <textarea id="settings" placeholder='{"outline": 0.9, ...}'></textarea>
</main>
<script src="sprout.js"></script>
<script>
const sprouts = [];
const place = (cv, size) => { const s = BlipSprout.canvasSize(size); cv.style.width = s.width + 'px'; cv.style.height = s.height + 'px'; sprouts.push(BlipSprout.create(cv, { size, bubble: size > 40 })); }; // the bubble only on the large one
place(document.getElementById('big'), 160);
document.querySelectorAll('.chip canvas').forEach(cv => place(cv, 32));

const LABEL = { hidden: 'Hidden', working: 'Working', needs: 'Needs you', done: 'Done', error: 'Error' };
const bar = document.getElementById('states');
function setState(s) {
  sprouts.forEach(sp => sp.setState(s));
  bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
BlipSprout.STATES.forEach((s, i) => {
  const b = document.createElement('button'); b.dataset.s = s; b.textContent = `${LABEL[s]} ${i + 1}`;
  b.onclick = () => setState(s); bar.appendChild(b);
});
addEventListener('keydown', e => { if (e.target.matches('textarea')) return; const s = BlipSprout.STATES[+e.key - 1]; if (s) setState(s); });
document.getElementById('settings').oninput = e => {
  try { const v = BlipSprout.withDefaults(e.target.value.trim() ? JSON.parse(e.target.value) : {}); sprouts.forEach(sp => sp.update(v)); e.target.style.borderColor = ''; }
  catch (err) { e.target.style.borderColor = '#d9534f'; }
};
// Shows that the drawing loop stops while hidden.
setInterval(() => { document.getElementById('status').textContent = `State: ${sprouts[0].state}. Drawing loop: ${sprouts[0].running ? 'running' : 'stopped'}.`; }, 250);
setState('working');
</script>
</body>
</html>
